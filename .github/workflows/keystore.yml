# 一次性生成 Android 签名（只跑一次）
#
# 产出 artifact 里有：
#   secrets.txt                  → 4 个待写入 GitHub Secrets 的值
#   rosenthal-release.keystore   → 离线备份用（丢了就无法覆盖升级）
#   keystore.base64.txt          → KEYSTORE_BASE64 的单行文本
#
# ⚠️ artifact 含私钥，请下载保存后立即删除该次 Run / Artifact，并把 keystore 离线备份。

name: 一次性生成 Android 签名

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: 生成 keystore 与随机密码
        run: |
          set -euo pipefail
          ALIAS=rosenthal
          STORE_PASSWORD=$(openssl rand -hex 24)
          KEY_PASSWORD=$(openssl rand -hex 24)
          keytool -genkeypair \
            -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=Rosenthal Family, OU=Family, O=Rosenthal, L=Home, ST=Home, C=CN"
          base64 -w0 "$RUNNER_TEMP/release.keystore" > "$RUNNER_TEMP/keystore.base64.txt"
          {
            echo "KEY_ALIAS=$ALIAS"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "KEYSTORE_BASE64=$(cat "$RUNNER_TEMP/keystore.base64.txt")"
          } > "$RUNNER_TEMP/secrets.txt"
          mkdir -p out
          cp "$RUNNER_TEMP/secrets.txt" out/secrets.txt
          cp "$RUNNER_TEMP/release.keystore" out/rosenthal-release.keystore
          cp "$RUNNER_TEMP/keystore.base64.txt" out/keystore.base64.txt
          echo "已生成，请下载 artifact 后按 docs/APK-构建与安装.md 保存 Secrets"

      - uses: actions/upload-artifact@v4
        with:
          name: rosenthal-keystore-PLEASE-SAVE
          path: out/
          retention-days: 3
          if-no-files-found: error
