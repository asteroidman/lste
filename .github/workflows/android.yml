# 罗森塔尔 · Android APK 云构建
#
# 触发：手动点「Run workflow」，或推送 v* tag。
# 前置：先跑一次「一次性生成 Android 签名」，把 4 个值存进仓库 Secrets：
#   KEYSTORE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
#
# 关键设计：
# · 先跑 single/_smoke.mjs（含 jsdom 真实点击链路），不全绿就不出包；
# · www/index.html 由 single/罗森塔尔.html 逐字节复制，唯一事实来源不变；
# · 固定签名覆盖安装，升级不清数据；versionCode 用 run_number 单调递增；
# · 校验 APK 内含本地网页、且合并后的 Manifest 不含 INTERNET。

name: 罗森塔尔 · Android APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: '版本号（如 1.0.1）'
        required: false
        default: '1.0.0'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # jsdom 也在这里装好，供下面的单文件版回归使用
      - name: 安装前端依赖
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: 回归：单文件版（82 项，含 jsdom 真实点击链路）
        run: node single/_smoke.mjs

      - name: 生成网页并复制进 Capacitor
        run: |
          node single/build.mjs
          node mobile/scripts/sync-web.mjs
          node mobile/scripts/verify-web.mjs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest 已预装 Android SDK（含 licenses / build-tools），无需再装；
      # 之前用 android-actions/setup-android@v3 反而在此失败过。

      - name: cap sync（把网页与插件同步进 Android 工程）
        working-directory: mobile
        run: npx cap sync android

      - name: 解码固定签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64，请先运行「一次性生成 Android 签名」并保存 4 个 Secrets"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rosenthal-release.keystore"
          test -s "$RUNNER_TEMP/rosenthal-release.keystore" || { echo "::error::keystore 解码失败"; exit 1; }
          echo "ROSENTHAL_KEYSTORE_PATH=$RUNNER_TEMP/rosenthal-release.keystore" >> "$GITHUB_ENV"

      - name: 编译并签名 Release APK
        working-directory: mobile/android
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # PKCS12 格式里密钥密码 = keystore 密码，是同一个值；
          # 无论 Secrets 里 KEY_PASSWORD 存了什么，这里都用 STORE_PASSWORD，避免两者不一致导致签名失败。
          KEY_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName="${{ inputs.versionName || github.ref_name }}"

      - name: 校验 APK（本地网页 / 无联网权限）
        run: |
          APK=$(find mobile/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::没找到 APK"; exit 1; }
          unzip -l "$APK" | grep -q 'assets/public/index.html' || { echo "::error::APK 里没有本地网页"; exit 1; }
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f 2>/dev/null | sort | tail -1)
          if [ -n "$AAPT" ]; then
            echo "—— APK 实际申请的权限 ——"
            "$AAPT" dump permissions "$APK" | tee /tmp/perms.txt
            if grep -q 'android.permission.INTERNET' /tmp/perms.txt; then
              echo "::error::APK 仍带 INTERNET 权限"; exit 1
            fi
          else
            MERGED=$(find mobile/android/app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml | head -1)
            if [ -n "$MERGED" ] && grep -v 'tools:node="remove"' "$MERGED" | grep -q 'android.permission.INTERNET'; then
              echo "::error::合并后的 Manifest 仍带 INTERNET 权限"; exit 1
            fi
          fi
          cp "$APK" "罗森塔尔.apk"
          ls -lh "罗森塔尔.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: rosenthal-apk
          path: 罗森塔尔.apk
          retention-days: 30
          if-no-files-found: error
