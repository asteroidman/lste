<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F1E8">
<title>罗森塔尔 · 网页版</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="brand">罗森塔尔 <span>Rosenthal</span></div>
    <div class="who" id="who"></div>
  </header>

  <main class="view" id="view"></main>

  <nav class="tabbar" id="tabbar" hidden>
    <button data-tab="today">今天</button>
    <button data-tab="growth">成长</button>
    <button data-tab="shop">兑换</button>
    <button data-tab="week">周复盘</button>
    <button data-tab="rules">规则</button>
    <button data-tab="parent">家长端</button>
  </nav>

  <div class="mask" id="mask" hidden></div>
  <div class="sheet" id="sheet" hidden><div class="sheet__body" id="sheet-body"></div></div>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
